<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bg:#f7f7f5;--card:#ffffff;--fg:#1d2530;--muted:#6b7684;--line:#e4e6ea;--soft:#f1f3f6;
  --accent:#2563c9;--accent-soft:#e8f0fc;--cap:#9aa8b8;
  --c-low:#d64541;--c-mid:#f0a020;--c-ok:#2e9d57;--c-full:#2563c9;
  --up:#2e9d57;--down:#d64541;
}
body.dark{
  --bg:#12161b;--card:#1a2028;--fg:#e5e9ee;--muted:#93a0ae;--line:#2a323c;--soft:#222a33;
  --accent:#5b9bf0;--accent-soft:#1d2b3d;
  --c-low:#ef6b66;--c-mid:#f4b545;--c-ok:#4fc27b;--c-full:#5b9bf0;
  --up:#4fc27b;--down:#ef6b66;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;font-size:14px;line-height:1.55;}
.wrap{max-width:1180px;margin:0 auto;padding:6px 0 48px;display:flex;flex-direction:column;gap:14px;}
h1{margin:0;font-size:1.5rem;font-weight:700;}
.sub{color:var(--muted);font-size:13px;}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
button{font:inherit;cursor:pointer;}
.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 14px;font-size:13px;}
.tabs{display:flex;flex-wrap:wrap;gap:2px 6px;border-bottom:1px solid var(--line);}
.tabs button{border:0;background:none;color:var(--muted);padding:9px 14px;border-bottom:2px solid transparent;font-size:14px;}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
.focus{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;}
.focus .bar{display:flex;align-items:center;gap:10px;}
.focus .lab{font-size:13px;color:var(--muted);white-space:nowrap;}
.months{display:flex;flex-wrap:wrap;gap:4px;}
.months button{border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--fg);padding:4px 14px;font-size:13px;}
.months button.on{background:var(--accent);color:#fff;font-weight:600;border-color:var(--accent);}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;}
.kpi .k{font-size:13px;color:var(--muted);}
.kpi .v{font-size:1.85rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25;}
.kpi .d{font-size:12.5px;font-variant-numeric:tabular-nums;margin-top:2px;}
.up{color:var(--up);}.down{color:var(--down);}.flat{color:var(--muted);}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
.panel h2{margin:0 0 2px;font-size:15.5px;font-weight:600;}
.panel .hint{font-size:12.5px;color:var(--muted);margin:0 0 12px;}
.summary p{margin:6px 0 10px;line-height:1.7;}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px 24px;}
.rank h3{font-size:13px;color:var(--muted);font-weight:500;margin:8px 0 4px;}
.rank ol{list-style:none;margin:0;padding:0;}
.rank li{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;}
.rank .no{width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex:none;}
.rank .nm{flex:1;min-width:0;}.rank .nm small{color:var(--muted);margin-left:6px;font-size:12px;}
.rank .val{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;}
.empty{color:var(--muted);font-size:13px;padding:6px 0;}
svg text{font-family:inherit;}
.chartbox{position:relative;overflow:hidden;}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.14);white-space:nowrap;font-variant-numeric:tabular-nums;display:none;}
.foot{font-size:12px;color:var(--muted);margin-top:8px;}
.health{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
.hc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--fg);}
.hc.low{border-color:var(--c-low);border-width:2px;}
.hc.mid{border-color:var(--c-mid);border-width:2px;}
.hc.open{grid-column:1/-1;cursor:default;}
.hc .top{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;}
.hc .top i{width:10px;height:10px;border-radius:50%;flex:none;}
.hc .big{font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;}
.hc .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px;}
.hc .detail{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;}
.hc table{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;width:100%;}
.hc th,.hc td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;}
.hc th:first-child,.hc td:first-child{text-align:left;}
.hc .tblwrap{overflow-x:auto;}

/* Series-grouped health cards */
.hc-series{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:4px;}
.hc-series.low{border-color:var(--c-low);border-width:2px;}
.hc-series.mid{border-color:var(--c-mid);border-width:2px;}
.hcsg-hdr{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;flex-wrap:wrap;}
.hcsg-hdr:hover{background:var(--soft);}
.hcsg-dot{width:12px;height:12px;border-radius:50%;flex:none;}
.hcsg-name{font-weight:700;font-size:14px;white-space:nowrap;}
.hcsg-label{font-size:13px;color:var(--muted);white-space:nowrap;}
.hcsg-kpi{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:1;min-width:0;}
.hcsg-toggle{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap;}
.hcsg-body{border-top:1px solid var(--line);padding:12px;}
.health-inner{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;}
</style>
</head>
<body>
<div class="wrap">

  <div>
    <h1>🔧 設備可靠性分析儀表板</h1>
    <div class="sub" id="hdr-sub">富強醫材股份有限公司 設備課</div>
  </div>

  <div class="row">
    <button class="btn" id="darkBtn">切換深色模式</button>
  </div>

  <nav class="tabs" id="tabs"></nav>

  <div class="focus">
    <div class="bar">
      <span class="lab">月份焦點</span>
      <div class="months" id="months"></div>
    </div>
    <div class="sub" id="scopeNote"></div>
  </div>

  <div class="cards" id="kpis"></div>

  <section class="panel summary" id="summary"></section>

  <section class="panel">
    <h2 id="trendTitle">MTBF / MTTR 月趨勢</h2>
    <div class="hint">上：MTBF（參考值，全廠 MTBF 會隨在用台數增減，不設目標）；下：MTTR（目標 ≤8h）。</div>
    <div class="chartbox" id="trend"></div>
    <div class="tip" id="trendTip"></div>
  </section>

  <section class="panel">
    <h2 id="barsTitle">各機台 MTBF</h2>
    <div class="hint">依 MTBF 由低到高排列；紅＜50h、橘 50–99h、藍≥100h（達標）。</div>
    <div class="chartbox" id="bars"></div>
  </section>

  <section class="panel">
    <h2>機台健康狀態（MTBF 排序）</h2>
    <div class="hint">依 MTBF 由低到高排序（MTBF 越短＝故障越頻繁）；紅框＜50h、橘框 50–99h、無框≥100h（達標）。系列 MTBF＝（在用台數×月時數 − 停工合計）÷ 故障合計（含無故障機台）；點系列展開各機台。</div>
    <div id="health" style="display:flex;flex-direction:column;gap:6px;"></div>
  </section>

  <div class="foot" id="foot"></div>
</div>

<script>
const DATA = /*__DATA__*/null;
if(!DATA){document.body.innerHTML='<div style="padding:40px;text-align:center;color:#888">尚無資料</div>';}

let curType = '全部';
let curMonth = '';

function init(){
  // Set latest month as default
  if(DATA.months && DATA.months.length){
    curMonth = DATA.months[DATA.months.length-1];
  }
  document.getElementById('hdr-sub').textContent =
    '富強醫材股份有限公司 設備課｜資料更新：' + (DATA.updated||'—');
  buildTabs();
  buildMonths();
  render();

  document.getElementById('darkBtn').onclick = function(){
    document.body.classList.toggle('dark');
    render();
  };
}

function buildTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = '';
  (DATA.types||['全部']).forEach(function(t){
    const b = document.createElement('button');
    b.textContent = t;
    if(t===curType) b.className='on';
    b.onclick = function(){
      curType = t;
      el.querySelectorAll('button').forEach(function(x){x.className='';});
      b.className='on';
      render();
    };
    el.appendChild(b);
  });
}

function buildMonths(){
  const el = document.getElementById('months');
  el.innerHTML = '';
  const months = ['全年'].concat(DATA.months||[]);
  months.forEach(function(m){
    const b = document.createElement('button');
    b.textContent = m;
    if((m==='全年' && !curMonth) || m===curMonth) b.className='on';
    b.onclick = function(){
      curMonth = (m==='全年') ? '' : m;
      el.querySelectorAll('button').forEach(function(x){x.className='';});
      b.className='on';
      render();
    };
    el.appendChild(b);
  });
}

function getKpi(){
  const kpis = DATA.kpis || {};
  const tk = kpis[curType] || {};
  const mk = curMonth ? (tk[curMonth]||null) : (tk['全年']||null);
  return mk;
}

function getPrevKpi(){
  if(!curMonth) return null;
  const months = DATA.months || [];
  const idx = months.indexOf(curMonth);
  if(idx <= 0) return null;
  const prev = months[idx-1];
  const kpis = DATA.kpis || {};
  const tk = kpis[curType] || {};
  return tk[prev] || null;
}

function render(){
  renderScope();
  renderKpis();
  renderSummary();
  renderTrend();
  renderBars();
  renderHealth();
}

function renderScope(){
  const months = DATA.months||[];
  const range = months.length ? months[0]+' – '+months[months.length-1] : '';
  const typeLabel = curType==='全部' ? '全部機型' : curType;
  const monthLabel = curMonth || '全年';
  document.getElementById('scopeNote').textContent =
    '目前顯示 — '+typeLabel+'　'+monthLabel;
  document.getElementById('trendTitle').textContent = typeLabel+'　MTBF / MTTR 月趨勢';
  document.getElementById('barsTitle').textContent = (curMonth||'全年')+'　各機台 MTBF';
  document.getElementById('foot').textContent = '資料範圍：2026年 '+range+'　｜　設備可靠性分析儀表板';
}

function renderKpis(){
  const kd = getKpi() || {};
  const prev = getPrevKpi() || {};

  function delta(key, unit, invert){
    if(!kd[key] || !prev[key]) return '';
    const d = +(kd[key]-prev[key]).toFixed(1);
    if(d===0) return '<span class="flat">— 持平</span>';
    const cls = (invert ? d>0 : d<0) ? 'down' : 'up';
    const sign = d>0 ? '↑' : '↓';
    return '<span class="'+cls+'">'+sign+' '+Math.abs(d)+unit+'</span>';
  }

  const cards = [
    { k:'MTBF（合計）', v: kd.mtbf!=null ? kd.mtbf+' h' : '—',
      d: delta('mtbf','h',false)
         +(kd.mtbf!=null ? ' <span class="flat">參考值</span>' : '') },
    { k:'MTTR（合計）', v: kd.mttr!=null ? kd.mttr+' h' : '—',
      d: delta('mttr','h',true)
         +(kd.mttr!=null ? ' <span class="'+(kd.mttr<=8?'up':'down')+'">目標≤8h</span>' : '') },
    { k:'可用率（合計）', v: kd.avail!=null ? kd.avail+'%' : '—',
      d: delta('avail','%',false)
         +(kd.avail!=null ? ' <span class="'+(kd.avail>=99?'up':'down')+'">目標≥99%</span>' : '')
         +(kd.low_avail ? ' <span class="down">'+kd.low_avail+' 個系列未達</span>' : '') },
    { k:'總停工時數', v: kd.downtime!=null ? kd.downtime+' h' : '—',
      d: kd.machines ? kd.machines+' 台機台' : '' },
    { k:'故障次數', v: kd.faults!=null ? kd.faults+' 次' : '—',
      d: delta('faults','次',true) },
  ];

  document.getElementById('kpis').innerHTML = cards.map(function(c){
    return '<div class="card kpi"><div class="k">'+c.k+'</div>'
      +'<div class="v">'+c.v+'</div>'
      +'<div class="d">'+c.d+'</div></div>';
  }).join('');
}

function renderSummary(){
  const kd = getKpi() || {};
  const prev = getPrevKpi() || {};
  const monthLabel = curMonth || '全年';
  const typeLabel = curType==='全部' ? '全部機型' : curType;

  let txt = '';
  if(kd.mtbf!=null){
    txt += monthLabel+'「'+typeLabel+'」MTBF <b>'+kd.mtbf+' h</b>（參考值）';
    if(prev.mtbf!=null){
      const d = +(kd.mtbf-prev.mtbf).toFixed(1);
      const prevMonth = DATA.months[DATA.months.indexOf(curMonth)-1] || '';
      if(d>0) txt += '，較'+prevMonth+' <b class="up">延長 '+d+'h</b>';
      else if(d<0) txt += '，較'+prevMonth+' <b class="down">縮短 '+Math.abs(d)+'h</b>';
      else txt += '，與前月持平';
    }
    txt += '。';
  }
  if(kd.mttr!=null){
    const mttrOk = kd.mttr<=8;
    txt += 'MTTR <b>'+kd.mttr+' h</b>（目標≤8h，';
    txt += mttrOk ? '<b class="up">達標</b>）。' : '<b class="down">超標</b>）。';
  }
  if(kd.faults!=null) txt += '共發生故障 <b>'+kd.faults+' 次</b>，總停工時數 <b>'+kd.downtime+' h</b>，涉及 <b>'+kd.machines+' 台</b>機台。';
  if(kd.avail!=null){
    txt += ' 可用率 <b>'+kd.avail+'%</b>（目標≥99%，'+(kd.avail>=99?'<b class="up">達標</b>）':'<b class="down">未達標</b>）');
    txt += kd.low_avail ? '，其中 <b class="down">'+kd.low_avail+' 個系列</b>低於 99%，請優先關注。' : '，各系列皆達標。';
  }

  document.getElementById('summary').innerHTML =
    '<h2>'+monthLabel+'「'+typeLabel+'」可靠性摘要</h2>'
    +'<p>'+txt+'</p>'
    +'<div class="two" id="ranks"></div>';
  renderRanks();
}

function renderRanks(){
  const machines = getMachines();
  const latestMonth = curMonth || (DATA.months && DATA.months[DATA.months.length-1]) || '';

  let list = machines.map(function(m){
    if(!curMonth){
      return {code:m.code, name:m.name, mtbf:m.mtbf, mttr:m.mttr, downtime:m.downtime, faults:m.faults};
    }
    const mo = m.monthly.find(function(x){return x.m===curMonth;});
    if(!mo) return null;
    return {code:m.code, name:m.name, mtbf:mo.mtbf, mttr:mo.mttr, downtime:mo.downtime, faults:mo.faults};
  }).filter(Boolean);

  list.sort(function(a,b){return a.mtbf-b.mtbf;});
  const low3mtbf = list.slice(0,3);
  list.sort(function(a,b){return b.mttr-a.mttr;});
  const top3mttr = list.slice(0,3);

  function rankHTML(title, arr, valKey, unit, cls){
    if(!arr.length) return '<div class="rank"><h3>'+title+'</h3><div class="empty">無資料</div></div>';
    return '<div class="rank"><h3>'+title+'</h3><ol>'
      +arr.map(function(item,i){
        return '<li><span class="no">'+(i+1)+'</span>'
          +'<span class="nm">'+item.code+'<small>'+item.name+'</small></span>'
          +'<span class="val '+(cls||'')+'">'+item[valKey]+unit+'</span></li>';
      }).join('')+'</ol></div>';
  }

  document.getElementById('ranks').innerHTML =
    rankHTML('MTBF 最短 Top 3（最常故障）', low3mtbf, 'mtbf', ' h', 'down')
    + rankHTML('MTTR 最長 Top 3（修復最慢）', top3mttr, 'mttr', ' h', 'down');
}

function getTrend(){
  const trend = DATA.trend || {};
  return trend[curType] || [];
}

function getMachines(){
  const all = DATA.machines || [];
  if(curType==='全部') return all;
  return all.filter(function(m){return m.type===curType;});
}

// ── Trend Chart ──────────────────────────────────────────────────────
function renderTrend(){
  const trend = getTrend();
  const el = document.getElementById('trend');
  if(!trend.length){ el.innerHTML='<div class="empty" style="padding:20px 0">無趨勢資料</div>'; return; }

  const W=el.offsetWidth||800;
  const isDark = document.body.classList.contains('dark');
  const blueC  = isDark ? '#5b9bf0' : '#2563c9';
  const orngC  = '#f0a020';
  const redC   = '#d64541';
  const gridC  = isDark ? '#2a323c' : '#eceef1';
  const fgC    = isDark ? '#93a0ae' : '#6b7684';
  const bgHit  = isDark ? '#1a2028' : '#fff';
  const MTTR_T = 8;

  // 兩個面板：上 MTBF、下 MTTR，共用 X 軸
  const pad={l:56, r:24};
  const P1={t:34, h:120}, gap=54, P2={t:P1.t+P1.h+gap, h:110};
  const H = P2.t + P2.h + 30;
  const cw = W-pad.l-pad.r;
  const inset=28;
  function xp(i){ return pad.l + inset + (trend.length===1 ? (cw-2*inset)/2 : i/(trend.length-1)*(cw-2*inset)); }

  function niceTicks(lo, hi, n){
    const span = Math.max(hi-lo, 1e-6);
    const raw = span/n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1,2,2.5,5,10].map(function(k){return k*mag;}).find(function(st){return span/st<=n;}) || 10*mag;
    const a = Math.floor(lo/step)*step, b = Math.ceil(hi/step)*step;
    const out=[]; for(let v=a; v<=b+step*1e-6; v+=step) out.push(+v.toFixed(6));
    return out;
  }
  function vals(k){ return trend.map(function(d){return d[k];}).filter(function(v){return v!=null&&!isNaN(v);}); }

  let svg='';
  function panel(P, key, color, ticks, fmtLabel, target){
    const lo=ticks[0], hi=ticks[ticks.length-1];
    const yp=function(v){ return P.t + (1-(v-lo)/(hi-lo||1))*P.h; };
    ticks.forEach(function(v){
      const y=yp(v);
      svg+='<line x1="'+pad.l+'" y1="'+y+'" x2="'+(pad.l+cw)+'" y2="'+y+'" stroke="'+gridC+'"/>';
      svg+='<text x="'+(pad.l-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="'+fgC+'">'+v+'</text>';
    });
    if(target!=null){
      const y=yp(target);
      svg+='<line x1="'+pad.l+'" y1="'+y+'" x2="'+(pad.l+cw)+'" y2="'+y+'" stroke="'+orngC+'" stroke-width="1.5" stroke-dasharray="5,4"/>';
      svg+='<text x="'+(pad.l+4)+'" y="'+(y+14)+'" text-anchor="start" font-size="11" font-weight="600" fill="'+orngC+'">目標 ≤'+target+'h</text>';
    }
    let d='', pen=false;
    trend.forEach(function(pt,i){
      const v=pt[key];
      if(v==null||isNaN(v)){ pen=false; return; }
      d+=(pen?'L':'M')+xp(i)+','+yp(v); pen=true;
    });
    svg+='<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round"/>';
    trend.forEach(function(pt,i){
      const v=pt[key]; if(v==null||isNaN(v)) return;
      const isCur=pt.m===curMonth;
      const c = (target!=null && v>target) ? redC : color;
      const x=xp(i), y=yp(v);
      svg+='<circle cx="'+x+'" cy="'+y+'" r="'+(isCur?6:4)+'" fill="'+c+'" stroke="'+bgHit+'" stroke-width="2"/>';
      svg+='<text x="'+x+'" y="'+(y-10)+'" text-anchor="middle" font-size="11" font-weight="'+(isCur?700:500)+'" fill="'+c+'">'+fmtLabel(v)+'</text>';
    });
  }

  // 面板標題
  svg+='<text x="'+pad.l+'" y="'+(P1.t-14)+'" font-size="12" font-weight="700" fill="'+blueC+'">MTBF（h）參考值</text>';
  svg+='<text x="'+pad.l+'" y="'+(P2.t-14)+'" font-size="12" font-weight="700" fill="'+orngC+'">MTTR（h）　<tspan fill="'+fgC+'" font-weight="400">紅點＝超過目標</tspan></text>';

  const mb=vals('mtbf'), mt=vals('mttr');
  if(mb.length){
    const lo=Math.min.apply(null,mb), hi=Math.max.apply(null,mb), padv=(hi-lo)*0.15||hi*0.1||10;
    panel(P1,'mtbf',blueC, niceTicks(Math.max(0,lo-padv), hi+padv, 3), function(v){return (+v).toFixed(0);}, null);
  }
  if(mt.length){
    const hi=Math.max(MTTR_T*1.25, Math.max.apply(null,mt)*1.15);
    panel(P2,'mttr',orngC, niceTicks(0, hi, 4), function(v){return (+v).toFixed(1);}, MTTR_T);
  }

  // X 軸標籤
  trend.forEach(function(pt,i){
    const x=xp(i), isCur=pt.m===curMonth;
    if(isCur){
      svg+='<rect x="'+(x-22)+'" y="'+(P1.t-6)+'" width="44" height="'+(P2.t+P2.h-P1.t+12)+'" rx="6" fill="'+blueC+'" opacity="0.06"/>';
    }
    svg+='<text x="'+x+'" y="'+(H-8)+'" text-anchor="middle" font-size="12" font-weight="'+(isCur?700:400)+'" fill="'+(isCur?blueC:fgC)+'">'+pt.m+'</text>';
  });

  el.innerHTML='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="display:block">'+svg+'</svg>';
}

// ── Bar Chart ─────────────────────────────────────────────────────────
function renderBars(){
  const machines = getMachines();
  const el = document.getElementById('bars');

  let list = machines.map(function(m){
    if(curMonth){
      const mo = m.monthly.find(function(x){return x.m===curMonth;});
      if(!mo) return null;
      return {code:m.code, name:m.name, mtbf:mo.mtbf, mttr:mo.mttr, faults:mo.faults, downtime:mo.downtime};
    }
    return {code:m.code, name:m.name, mtbf:m.mtbf, mttr:m.mttr, faults:m.faults, downtime:m.downtime};
  }).filter(Boolean);

  if(!list.length){ el.innerHTML='<div class="empty" style="padding:20px 0">無資料</div>'; return; }
  list.sort(function(a,b){return a.mtbf-b.mtbf;});

  const ROW=28, PAD_L=180, PAD_R=60, PAD_V=12;
  const W=el.offsetWidth||800;
  const barW=W-PAD_L-PAD_R;
  const H=list.length*ROW+PAD_V*2;

  const isDark=document.body.classList.contains('dark');
  const fgC=isDark?'#93a0ae':'#6b7684';
  const fg2=isDark?'#e5e9ee':'#1d2530';
  const gridC=isDark?'#2a323c':'#eee';

  const mtbfValsBar = list.map(function(d){return d.mtbf;});
  const barScale = Math.max(150, Math.ceil(Math.max.apply(null,mtbfValsBar)/50)*50);

  let svg='';
  // Grid lines at MTBF ticks
  [0,50,100,barScale].forEach(function(v){
    const x=PAD_L+v/barScale*barW;
    const isTarget=v===100;
    svg+='<line x1="'+x+'" y1="'+PAD_V+'" x2="'+x+'" y2="'+(H-PAD_V)+'"'
      +' stroke="'+(isTarget?'#2563c9':gridC)+'" stroke-width="'+(isTarget?1.5:1)+'"'
      +' stroke-dasharray="'+(isTarget?'4,3':'')+'" />';
    if(v!==0)
      svg+='<text x="'+x+'" y="'+(PAD_V-4)+'" text-anchor="middle" font-size="10" fill="'+(isTarget?'#2563c9':fgC)+'">'+v+'h'+(isTarget?' ★':'')+'</text>';
  });

  list.forEach(function(item,i){
    const y=PAD_V+i*ROW;
    const bh=ROW*0.55, by=y+(ROW-bh)/2;
    const bw=Math.max(item.mtbf/barScale*barW,2);
    const col=item.mtbf>=100?'#2563c9':item.mtbf>=50?'#f0a020':'#d64541';

    // Label (series Chinese name + machine name)
    const _snMap = DATA.series_names || {};
    const _sCode = (item.code||'').replace(/-\d+$/,'');
    const _sLabel = _snMap[_sCode] || (item.code||'').replace('M-','').replace(/-\d+$/,'');
    svg+='<text x="'+(PAD_L-8)+'" y="'+(y+ROW/2+4)+'" text-anchor="end" font-size="12" fill="'+fg2+'">'+_sLabel+'</text>';
    svg+='<text x="'+(PAD_L-8)+'" y="'+(y+ROW/2+16)+'" text-anchor="end" font-size="10" fill="'+fgC+'">'+item.name+'</text>';

    // Bar
    svg+='<rect x="'+PAD_L+'" y="'+by+'" width="'+bw+'" height="'+bh+'" rx="3" fill="'+col+'" opacity="0.85"/>';
    // Value label
    svg+='<text x="'+(PAD_L+bw+4)+'" y="'+(by+bh/2+4)+'" font-size="11" font-weight="600" fill="'+col+'">'+item.mtbf+'h</text>';
  });

  el.innerHTML='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="display:block">'+svg+'</svg>';
}

// ── Health Cards ──────────────────────────────────────────────────────
function renderHealth(){
  const machines = getMachines();
  const el = document.getElementById('health');

  let list = machines.map(function(m){
    if(curMonth){
      const mo = m.monthly.find(function(x){return x.m===curMonth;});
      if(!mo) return Object.assign({},m,{_avail:null});
      return Object.assign({},m,{_avail:mo.avail,_mtbf:mo.mtbf,_mttr:mo.mttr,_faults:mo.faults,_downtime:mo.downtime,_mo:mo});
    }
    return Object.assign({},m,{_avail:m.avail,_mtbf:m.mtbf,_mttr:m.mttr,_faults:m.faults,_downtime:m.downtime});
  });

  // Group by series
  const seriesMap = {};
  list.forEach(function(m){
    const s = m.series || m.code;
    if(!seriesMap[s]) seriesMap[s] = {series:s, name:m.name, type:m.type, machines:[]};
    seriesMap[s].machines.push(m);
  });

  // Sort each series' machines by MTBF asc
  Object.values(seriesMap).forEach(function(sg){
    sg.machines.sort(function(a,b){
      if(a._mtbf==null||isNaN(a._mtbf)) return 1;
      if(b._mtbf==null||isNaN(b._mtbf)) return -1;
      return a._mtbf - b._mtbf;
    });
    // Series-level aggregate: avg MTBF, avg MTTR, avg avail, sum faults
    var mbfs = sg.machines.map(function(m){return m._mtbf;}).filter(function(v){return v!=null&&!isNaN(v);});
    var mttrs = sg.machines.map(function(m){return m._mttr;}).filter(function(v){return v!=null&&!isNaN(v);});
    var avails= sg.machines.map(function(m){return m._avail;}).filter(function(v){return v!=null&&!isNaN(v);});
    sg.avgMtbf  = mbfs.length  ? Math.round(mbfs.reduce(function(a,b){return a+b;},0)/mbfs.length*10)/10 : null;
    sg.avgMttr  = mttrs.length ? Math.round(mttrs.reduce(function(a,b){return a+b;},0)/mttrs.length*10)/10 : null;
    sg.avgAvail = avails.length? Math.round(avails.reduce(function(a,b){return a+b;},0)/avails.length*10)/10 : null;
    sg.sumFaults= sg.machines.reduce(function(a,m){return a+(m._faults||0);},0);
    sg.minMtbf  = mbfs.length  ? Math.min.apply(null,mbfs) : null;
    // 系列 KPI：合計法（含無故障的在用機台），由後端計算
    var sk = (DATA.series_kpi||{})[sg.series];
    var kk = sk && sk[curMonth||'全年'];
    if(kk){
      sg.avgMtbf = kk.mtbf; sg.avgMttr = kk.mttr; sg.avgAvail = kk.avail;
      sg.sumFaults = kk.faults; sg.nAll = kk.n; sg.nFault = kk.n_fault;
    }
  });

  // Sort series by avgMtbf asc (worst first)
  const seriesArr = Object.values(seriesMap).sort(function(a,b){
    if(a.avgMtbf==null||isNaN(a.avgMtbf)) return 1;
    if(b.avgMtbf==null||isNaN(b.avgMtbf)) return -1;
    return a.avgMtbf - b.avgMtbf;
  });

  let html = '';
  const snMap = DATA.series_names || {};
  seriesArr.forEach(function(sg, si){
    const mb  = sg.avgMtbf;
    const col = mb==null||isNaN(mb) ? '#9aa8b8' : mb>=100 ? '#2563c9' : mb>=50 ? '#f0a020' : '#d64541';
    const cls = mb==null||isNaN(mb) ? '' : mb<50 ? ' low' : mb<100 ? ' mid' : '';
    const seriesName = snMap[sg.series] || sg.series;

    // Series header card (always full-width)
    html += '<div class="hc-series'+(cls?cls:'')+'" id="hcsg'+si+'">'
      +'<div class="hcsg-hdr" onclick="toggleSg('+si+')">'
      +'<span class="hcsg-dot" style="background:'+col+'"></span>'
      +'<span class="hcsg-name">'+seriesName+'</span>'
      +'<span class="hcsg-label">'+sg.series+'</span>'
      +'<span class="hcsg-kpi">'+(sg.nAll?'在用 '+sg.nAll+' 台・故障 '+(sg.nFault||0)+' 台　':'')
      +'MTBF '+(mb!=null&&!isNaN(mb)?mb+'h':(sg.sumFaults===0?'無故障':'無資料'))
      +'　MTTR '+(sg.avgMttr!=null&&!isNaN(sg.avgMttr)?sg.avgMttr+'h':(sg.sumFaults===0?'—':'無資料'))
      +'　可用率 '+(sg.avgAvail!=null&&!isNaN(sg.avgAvail)?sg.avgAvail+'%':'—')
      +'　故障 '+sg.sumFaults+'次'
      +'</span>'
      +'<span class="hcsg-toggle" id="hcsgarrow'+si+'">▶</span>'
      +'</div>'
      // Machine cards row (hidden by default)
      +'<div class="hcsg-body" id="hcsgb'+si+'" style="display:none">'
      +'<div class="health-inner">';

    sg.machines.forEach(function(m, mi){
      const mb2 = m._mtbf;
      const mb2v = mb2!=null&&!isNaN(mb2);
      const col2= !mb2v?'#9aa8b8':mb2>=100?'#2563c9':mb2>=50?'#f0a020':'#d64541';
      const cls2= !mb2v?'':mb2<50?' low':mb2<100?' mid':'';
      const id  = 'hcm'+si+'_'+mi;
      const shortCode = m.code.replace(sg.series+'-','');

      const monthRows = m.monthly.map(function(mo){
        const mv=mo.mtbf!=null&&!isNaN(mo.mtbf);
        const c3=!mv?'#9aa8b8':mo.mtbf>=100?'#2563c9':mo.mtbf>=50?'#f0a020':'#d64541';
        return '<tr><td>'+mo.m+'</td>'
          +'<td style="color:'+c3+';font-weight:600">'+(mv?mo.mtbf+'h':'—')+'</td>'
          +'<td>'+(mo.mttr!=null&&!isNaN(mo.mttr)?mo.mttr+'h':'—')+'</td>'
          +'<td>'+(mo.avail!=null&&!isNaN(mo.avail)?mo.avail+'%':'—')+'</td>'
          +'<td>'+(mo.faults!=null?mo.faults:'—')+'</td>'
          +'<td>'+(mo.downtime!=null&&!isNaN(mo.downtime)?mo.downtime+'h':'—')+'</td></tr>';
      }).join('');

      html += '<div class="hc'+cls2+'" id="'+id+'" onclick="toggleMc(\''+id+'\')">'
        +'<div class="top"><i style="background:'+col2+'"></i>'
        +'<span style="font-size:12px;font-weight:600">'+shortCode+'</span></div>'
        +'<div style="font-size:11.5px;color:var(--muted);margin-bottom:2px;line-height:1.3">'+m.name+'</div>'
        +'<div class="big" style="color:'+col2+'">'+(mb2v?mb2+'h':'<span style="font-size:1rem;color:var(--muted)">'+(curMonth&&!m._faults?'本月無故障':'無資料')+'</span>')+'</div>'
        +'<div class="meta">MTTR '+(m._mttr!=null&&!isNaN(m._mttr)?m._mttr+'h':(curMonth&&!m._faults?'—':'無資料'))
        +'　可用率 '+(m._avail!=null&&!isNaN(m._avail)?m._avail+'%':'—')+'</div>'
        +'<div class="meta">故障 '+(m._faults!=null?m._faults+'次':'—')+'</div>'
        +'<div class="detail" id="'+id+'d" style="display:none">'
        +'<div class="tblwrap"><table>'
        +'<tr><th>月份</th><th>MTBF</th><th>MTTR</th><th>可用率</th><th>故障</th><th>停工</th></tr>'
        +monthRows+'</table></div></div>'
        +'</div>';
    });

    html += '</div></div></div>';
  });

  el.innerHTML = html;
}

function toggleSg(si){
  const body  = document.getElementById('hcsgb'+si);
  const arrow = document.getElementById('hcsgarrow'+si);
  if(!body) return;
  const open = body.style.display!=='none';
  body.style.display  = open ? 'none' : 'block';
  if(arrow) arrow.textContent = open ? '▶' : '▼';
}

function toggleMc(id){
  const card  = document.getElementById(id);
  const detail= document.getElementById(id+'d');
  if(!detail) return;
  const open = detail.style.display!=='none';
  detail.style.display = open ? 'none' : 'block';
  if(!open) card.classList.add('open');
  else card.classList.remove('open');
}

// Redraw on resize
let resizeTimer;
window.addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){ renderTrend(); renderBars(); }, 150);
});

if(DATA) init();
</script>
